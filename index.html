<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Viewport tag for mobile responsiveness -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <!-- Linking external CSS file -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Message container for winner message, initially hidden -->
    <div class="msg-container hide">
        <p id="msg">Winner</p>
        <!-- Button to start a new game after winning -->
        <button id="new-btn">New Game</button>
    </div>

    <main>
        <h1>Tic Tac Toe</h1>

        <!-- Scoreboard for Player O and Player X -->
        <div class="score-board">
            <p>Player O: <span id="score-o">0</span></p>
            <p>Player X: <span id="score-x">0</span></p>
        </div>

        <!-- Game board container -->
        <div class="container">
            <div class="game">
                <!-- 9 empty boxes (buttons) for the Tic Tac Toe grid -->
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
            </div>
        </div>

        <!-- Grouped reset buttons for better layout -->
        <div class="buttons-container">
            <button id="reset-btn">Reset Game</button>
            <button id="reset-scores-btn">Reset Scores</button>
        </div>

    </main>

    <!-- Linking external JavaScript file -->
    <script src="app.js"></script>
</body>
</html>
